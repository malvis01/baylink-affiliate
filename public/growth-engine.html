<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BayLINK AI Growth Engine</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f8fb;color:#102033}main{max-width:1180px;margin:auto;padding:34px 6%}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:26px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:1.5px;color:#087f5b}.top h1{margin:6px 0;font-size:36px}.muted{color:#687789;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:#087f5b;color:#fff}.outline{background:#fff;border:1px solid #cfd8e2}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}.stat,.card{background:#fff;border:1px solid #e6ebf0;border-radius:16px;padding:20px}.stat span{display:block;color:#687789;font-size:13px}.stat strong{display:block;font-size:28px;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card h2{margin-top:0}.item{padding:15px 0;border-bottom:1px solid #edf1f4}.item:last-child{border-bottom:0}.pill{display:inline-block;font-size:11px;font-weight:900;text-transform:uppercase;border-radius:999px;padding:5px 8px;background:#eef7f3;color:#087f5b}.error{background:#fff1f0;color:#b42318;border:1px solid #ffd3cf}.status{margin:12px 0}.empty{color:#687789}.back{color:#087f5b;text-decoration:none;font-weight:800}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:500px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<div class="top"><div><div class="eyebrow">BAYLINK AI GROWTH ENGINE</div><h1>Growth command center</h1><p class="muted">AI-assisted opportunities, campaigns, follow-ups and performance priorities based on real BayLINK activity.</p></div><div class="actions"><a class="back" href="/">← Back to BayLINK</a><button id="run" class="btn primary">Run Growth Analysis</button></div></div>
<div id="status" class="status"></div><div id="stats" class="stats"></div>
<div class="grid"><section class="card"><h2>Summary</h2><p id="summary" class="muted">No report loaded yet.</p><h2>Priority actions</h2><div id="priorities"></div></section><section class="card"><h2>AI recommendations</h2><div id="recommendations"><p class="empty">Run an analysis to generate the next growth queue.</p></div></section></div>
</main>
<script>
const $=id=>document.getElementById(id);const fmt=n=>Number(n||0).toLocaleString();const money=n=>'₦'+Number(n||0).toLocaleString();
function showStatus(text,error=false){$('status').innerHTML=text?'<div class="stat '+(error?'error':'')+'">'+text+'</div>':''}
function render(report){const m=report?.metrics||{};$('stats').innerHTML=[['Members',m.member_count],['Businesses',m.business_count],['Active offers',m.active_offer_count],['Clicks',m.click_count],['Conversions',m.conversion_count]].map(x=>'<div class="stat"><span>'+x[0]+'</span><strong>'+fmt(x[1])+'</strong></div>').join('');$('summary').textContent=report.summary||'No summary generated.';const p=Array.isArray(m.priorities)?m.priorities:[];$('priorities').innerHTML=p.length?p.map(x=>'<div class="item">'+x+'</div>').join(''):'<p class="empty">No priority actions returned.</p>';const r=Array.isArray(report.recommendations)?report.recommendations:[];$('recommendations').innerHTML=r.length?r.map(x=>'<div class="item"><span class="pill">'+(x.priority||'medium')+'</span><h3>'+x.title+'</h3><p class="muted">'+x.reason+'</p><p><b>Action:</b> '+x.action+'</p><p class="muted"><b>Expected:</b> '+x.expected_outcome+'</p></div>').join(''):'<p class="empty">No recommendations returned.</p>'}
async function run(){ $('run').disabled=true;$('run').textContent='Analyzing…';showStatus('Building the growth queue from current BayLINK data…');try{const r=await fetch('/api/growth-engine',{method:'POST'});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Growth engine failed.');render(j.report);showStatus('Analysis completed: '+new Date(j.report.generated_at).toLocaleString());}catch(e){showStatus(e.message||'Growth engine unavailable.',true)}finally{$('run').disabled=false;$('run').textContent='Run Growth Analysis'}}
$('run').addEventListener('click',run);
</script></body></html>
